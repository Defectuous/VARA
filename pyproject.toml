[project]
name = "vara"
version = "0.1.0"
description = "Visual and Audio Reality Assistant backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "anthropic>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "faster-whisper>=1.1,<2.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28,<1.0",
    "keyring>=25,<26",
    "kokoro-onnx>=0.4,<1",
    "markdown-it-py>=3,<5",
    "nvidia-cublas-cu12>=12,<13 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform != 'darwin'",
    "pydantic-settings>=2.6,<3.0",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
    "sqlalchemy>=2.0,<3.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false
# Pick package versions that have builds for both this Windows PC and the Linux host (some NVIDIA
# library releases are Linux-only).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
