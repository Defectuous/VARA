# --- logic and trick questions ------------------------------------------------------------------

[[case]]
id = "logic-alice-sisters"
category = "logic"
question = "Alice has 4 brothers and 1 sister. How many sisters does each of Alice's brothers have?"
expect_regex = ['\b(2|two)\s+sisters\b']
reject_regex = ['\b(each|brothers?)\b[^.]*\bhas\s+(1|one|only one)\s+sister\b']

[[case]]
id = "logic-bat-ball"
category = "logic"
question = "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?"
expect_any = ["$0.05", "5 cents", "five cents", "0.05"]

[[case]]
id = "logic-widgets"
category = "logic"
question = "If 5 machines take 5 minutes to make 5 widgets, how long would 100 machines take to make 100 widgets?"
