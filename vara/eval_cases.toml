[[case]]
id = "logic-directions"
category = "logic"
question = "I'm facing north. I turn right, then right again, then left. Which direction am I facing now?"
expect_regex = ['\beast\b']
reject_regex = ['facing (north|south|west)\b']

[[case]]
id = "logic-sheep"
category = "logic"
question = "A farmer has 17 sheep. All but 9 die. How many sheep are left?"
expect_number = 9

# --- code ---------------------------------------------------------------------------------------

[[case]]
id = "code-binary-search-bugs"
category = "code"
question = """Find the bug(s) in this Python and give a fixed version:

def binary_search(a, x):
    lo, hi = 0, len(a)
    while lo <= hi:
        mid = (lo + hi) // 2
        if a[mid] == x:
            return mid
        elif a[mid] < x:
            lo = mid
        else:
            hi = mid - 1
    return -1"""
expect_regex = ['lo\s*=\s*mid\s*\+\s*1']
# The code has no syntax error; claiming one is a hallucination.
reject_any = ["syntax error"]

[[case]]
id = "code-float-equality"
category = "code"
question = "In Python, what does print(0.1 + 0.2 == 0.3) print?"
expect_regex = ['\bFalse\b']

[[case]]
id = "code-list-alias"
category = "code"
question = """What does this Python print? Reply with only the output.

x = [1, 2, 3]
y = x
y.append(4)
print(len(x))"""
expect_regex = ['^\W*4\W*$']

[[case]]
id = "code-string-times-zero"
category = "code"
question = "In Python, what does 'abc' * 0 evaluate to?"
expect_any = ["''", '""', "empty string"]

[[case]]
id = "code-sql-having"
category = "code"
question = "Which SQL clause filters groups after GROUP BY has been applied?"
expect_any = ["HAVING"]

