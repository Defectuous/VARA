# Eval cases for `python -m vara eval` (vara/evals.py). Each case is one question with checks that
# grade the reply; a case passes only if every check passes. Checks (text matching ignores case):
#   expect_all / expect_any / reject_any   strings that must all / at least one / none appear
#   expect_regex / reject_regex             patterns that must / must not match
#   expect_number                           a number that must appear (commas ignored)
#   max_words, line_word_counts, first_letters, no_markdown
#   expect_search, expect_reasoning         whether a web search ran / the model reasoned
# Request options: web_search (default false), reasoning ("auto"/"on"/"off"; unset uses V.A.R.A.'s
# setting, as a normal chat would), spoken. Strings may use {month_name}, {day}, {year} for the day
# of the run.
#
# Keep answers unambiguous and stable. "current" cases need live web search and facts newer than
# the models' training; they can fail when search engines block SearXNG (the run records which
# engines didn't answer). Changing a case's checks makes its history incomparable, so give a changed
# case a new id.

