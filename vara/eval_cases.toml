[[case]]
id = "logic-monty-4-doors"
category = "logic"
question = "Monty Hall with 4 doors: one car, three goats. You pick a door. The host, who knows where the car is, opens one other door showing a goat, then lets you switch to one of the two remaining closed doors. What is your chance of winning if you stay, and if you switch? Give exact fractions."
