<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V.A.R.A.</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #dfe3e8; --text: #1b1f24; --muted: #66707b;
    --accent: #2f6fde; --accent-text: #ffffff; --user: #e7effc; --code: #f0f2f5;
    --danger: #c83a3a; --ok: #2e8b57; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1a1d21; --border: #2c3138; --text: #e6e9ed; --muted: #8b949e;
      --accent: #5b8def; --accent-text: #0d1117; --user: #1f2a3d; --code: #23272e;
      --danger: #e06363; --ok: #4fbf84; --warn: #e0a84a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 260px 1fr; overflow: hidden;
  }
  button, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Sidebar */
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand { padding: 16px 16px 8px; font-weight: 700; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  .brand img { width: 32px; height: 32px; flex: none; }
  .brand small { display: block; font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 12px; }
  #new-chat {
    margin: 8px 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; text-align: left;
  }
  #new-chat:hover { border-color: var(--accent); }
  #conversations { list-style: none; margin: 0; padding: 4px 8px 12px; overflow-y: auto; flex: 1; }
  #conversations li {
    display: flex; align-items: center; border-radius: 6px; padding: 6px 8px; gap: 4px;
    cursor: pointer; color: var(--muted);
  }
  #conversations li:hover, #conversations li.active { background: var(--bg); color: var(--text); }
  #conversations .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #conversations .del {
    visibility: hidden; border: 0; background: transparent; color: var(--muted); padding: 0 4px;
  }
  #conversations li:hover .del { visibility: visible; }
  #conversations .del:hover { color: var(--danger); }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #menu { display: none; border: 0; background: transparent; font-size: 20px; padding: 0 4px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor;
    white-space: nowrap;
  }
  .badge.local_only { color: var(--ok); }
  .badge.ask { color: var(--warn); }
  .badge.allowed { color: var(--accent); }
  .badge.down { color: var(--danger); }
  select {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }

  #messages { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble {
    background: var(--user); padding: 8px 14px; border-radius: 14px; max-width: 85%;
    white-space: pre-wrap;
  }
  .msg.assistant .bubble p { margin: 0 0 .7em; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    font: 13px/1.45 Consolas, "Cascadia Code", monospace; margin: 0 0 .7em;
  }
  .bubble code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-family: Consolas, monospace; font-size: .92em; }
  .bubble pre code { background: none; padding: 0; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .msg.error .bubble { color: var(--danger); }
  .msg.waiting .bubble { font-style: italic; opacity: .7; }
  .sources { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sources summary { cursor: pointer; }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .sources a { color: var(--accent); }
  .deals table { border-collapse: collapse; margin-top: 4px; }
  .deals td { padding: 2px 10px 2px 0; vertical-align: top; }
  .deals td.price { font-weight: 600; color: var(--text); white-space: nowrap; }
  #alerts { max-width: 780px; margin: 0 auto 12px; display: flex; flex-direction: column; gap: 6px; }
  #alerts:empty { display: none; }
  .alert {
    display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--ok); background: var(--panel); font-size: 14px;
  }
  .alert a { color: var(--accent); }
  .alert .grow { flex: 1; }
  .alert button { border: 0; background: transparent; color: var(--muted); }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h1 { font-size: 28px; margin: 0 0 4px; color: var(--text); letter-spacing: .08em; }

  /* Composer */
  form { padding: 12px 20px 18px; }
  .composer {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; padding: 6px 8px;
    max-height: 220px; min-height: 24px;
  }
  #send {
    border: 0; border-radius: 10px; padding: 8px 16px; background: var(--accent); color: var(--accent-text);
    font-weight: 600;
  }
  #send:disabled { opacity: .5; cursor: default; }
  #send.stop { background: var(--danger); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside {
      position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 10; transform: translateX(-100%);
      transition: transform .15s;
    }
    body.nav-open aside { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.3); }
    #menu { display: block; }
    #messages, form, header { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/favicon.svg" alt=""><div>V.A.R.A.<small>Visual and Audio Reality Assistant</small></div></div>
  <button id="new-chat" type="button">+ New chat</button>
  <ul id="conversations"></ul>
</aside>
<main>
  <header>
    <button id="menu" type="button" aria-label="Conversations">☰</button>
    <span id="conv-title">New chat</span>
    <span class="spacer"></span>
    <label>Model
      <select id="provider"><option value="">Auto</option></select>
    </label>
    <span id="privacy" class="badge" title="Privacy mode">…</span>
  </header>
  <div id="messages"><div id="alerts" aria-live="polite"></div><div class="thread" id="thread"></div></div>
  <form id="composer">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message V.A.R.A." autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { conversationId: null, privacyMode: null, streaming: null, live: null };
// Sent with every request; live events carrying it are this page's own and are skipped.
const CLIENT_ID = "page-" + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

const PRIVACY_LABELS = { local_only: "Local only", ask: "Ask before cloud", allowed: "Cloud allowed" };

// ---------- Rendering ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

// Minimal Markdown: fenced code blocks, inline code, bold/italic, paragraphs. All text is escaped first.
function renderMarkdown(text) {
  const parts = escapeHtml(text).split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      const body = part.replace(/^[\w+-]*\n/, "");
      return `<pre><code>${body.replace(/\n$/, "")}</code></pre>`;
    }
    return part.split(/\n{2,}/).filter((p) => p.trim()).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("");
  }).join("");
}

function describe(m) {
  const bits = [];
  if (m.provider) bits.push(m.model ? `${m.provider} · ${m.model}` : m.provider);
  if (m.output_tokens != null) bits.push(`${m.output_tokens} tokens`);
  if (m.cost_usd) bits.push(`$${m.cost_usd.toFixed(4)}`);
  if (m.memories_used && m.memories_used.length) bits.push(`${m.memories_used.length} memories used`);
  return bits.join(" · ");
}

function addMessage(role, text, meta) {
  $("thread").querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="bubble"></div><div class="meta"></div>`;
  setMessage(el, role, text, meta);
  $("thread").appendChild(el);
  scrollDown();
  return el;
}

function setMessage(el, role, text, meta) {
  const bubble = el.querySelector(".bubble");
  el.classList.remove("waiting");
  if (role === "assistant") bubble.innerHTML = renderMarkdown(text);
  else bubble.textContent = text;
  el.querySelector(".meta").textContent = meta || "";
}

// "This is going to take a minute": shown in the reply's place until the reply starts (not saved).
function showNotice(el, text) {
  el.querySelector(".bubble").textContent = text;
  el.classList.add("waiting");
}

function scrollDown() {
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

function showEmpty() {
  $("thread").innerHTML = `<div class="empty"><h1>V.A.R.A.</h1><div>Running on this PC. Ask anything.</div></div>`;
}

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) throw await httpError(res);
  return res.status === 204 ? null : res.json();
}

async function httpError(res) {
  let message = `${res.status} ${res.statusText}`;
  try {
    const body = await res.json();
    const d = body.detail;
    if (typeof d === "string") message = d;
    else if (d && d.message) message = d.message + (d.errors ? ": " + Object.values(d.errors).join("; ") : "");
    else if (Array.isArray(d)) message = d.map((e) => e.msg).join("; ");
  } catch {}
  const err = new Error(message);
  err.status = res.status;
  return err;
}

async function loadProviders() {
  try {
    const data = await api("/v1/providers");
    state.privacyMode = data.privacy_mode;
    const badge = $("privacy");
    badge.textContent = PRIVACY_LABELS[data.privacy_mode] || data.privacy_mode;
    badge.className = `badge ${data.privacy_mode}`;
    const select = $("provider");
    select.length = 1;
    for (const p of data.providers) {
      // One entry per model; the provider's default model keeps the plain provider name as its value.
      for (const model of p.models || [p.default_model]) {
        const opt = document.createElement("option");
        opt.value = model === p.default_model ? p.name : `${p.name}|${model}`;
        opt.textContent = `${p.name} (${model})${p.local ? "" : " ☁"}`;
        opt.disabled = !p.local && data.privacy_mode === "local_only";
        select.appendChild(opt);
      }
    }
    try { select.value = localStorage.getItem("vara.provider") || ""; } catch {}
    if (select.selectedOptions[0]?.disabled) select.value = "";
  } catch (err) {
    $("privacy").textContent = "Backend offline";
    $("privacy").className = "badge down";
  }
}

async function loadConversations() {
  let list = [];
  try { list = await api("/v1/conversations"); } catch { return; }
  const ul = $("conversations");
  ul.innerHTML = "";
  for (const c of list) {
    const li = document.createElement("li");
    li.dataset.id = c.id;
    li.classList.toggle("active", c.id === state.conversationId);
    li.innerHTML = `<span class="title"></span><button class="del" type="button" title="Delete">✕</button>`;
    li.querySelector(".title").textContent = c.title || "Untitled";
    li.onclick = () => openConversation(c.id);
    li.querySelector(".del").onclick = (e) => { e.stopPropagation(); deleteConversation(c); };
    ul.appendChild(li);
  }
}

async function openConversation(id) {
  if (state.streaming) return;
  if (state.live?.el) state.live = null; // stop following a live exchange you've navigated away from
  document.body.classList.remove("nav-open");
  const conv = await api(`/v1/conversations/${id}`);
  state.conversationId = conv.id;
  $("conv-title").textContent = conv.title || "Untitled";
  $("thread").innerHTML = "";
  for (const m of conv.messages) addMessage(m.role, m.content, m.role === "assistant" ? describe(m) : "");
  if (!conv.messages.length) showEmpty();
  markActive();
  $("input").focus();
}

async function deleteConversation(c) {
  if (!confirm(`Delete "${c.title || "Untitled"}" and all its messages? This can't be undone.`)) return;
  await api(`/v1/conversations/${c.id}`, { method: "DELETE" });
  if (state.conversationId === c.id) newChat();
  loadConversations();
}

function newChat() {
  if (state.streaming) return;
  if (state.live?.el) state.live = null; // stop following a live exchange you've navigated away from
  state.conversationId = null;
  $("conv-title").textContent = "New chat";
  showEmpty();
  markActive();
  document.body.classList.remove("nav-open");
  $("input").focus();
}

function markActive() {
  for (const li of $("conversations").children) li.classList.toggle("active", Number(li.dataset.id) === state.conversationId);
}

// ---------- Sending ----------
async function send(text, confirmCloud = false, existing = null) {
  const [provider = null, model = null] = ($("provider").value || "").split("|").map((v) => v || null);
  const body = {
    messages: [{ role: "user", content: text }], conversation_id: state.conversationId, provider, model, confirm_cloud: confirmCloud,
    // This device's clock, so V.A.R.A. knows the time where you are.
    client_time: localIsoTime(), client_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    client: CLIENT_ID,
  };
  const userEl = existing || addMessage("user", text);
  const replyEl = addMessage("assistant", "", "");
  replyEl.querySelector(".bubble").classList.add("cursor");
  const controller = new AbortController();
  state.streaming = controller;
  setSending(true);

  let reply = "";
  let answeredBy = "";
  try {
    const res = await fetch("/v1/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: controller.signal,
    });
    if (!res.ok) {
      const err = await httpError(res);
      if (err.status === 404 && state.conversationId !== null) {
        // This conversation was deleted (in another tab, or the listener's): continue in a new one.
        replyEl.remove();
        state.streaming = null;
        setSending(false);
        state.conversationId = null;
        $("conv-title").textContent = "New chat";
        markActive();
        return send(text, confirmCloud, userEl);
      }
      if (err.status === 409 && /confirm_cloud/.test(err.message) && !confirmCloud) {
        replyEl.remove();
        state.streaming = null;
        setSending(false);
        if (confirm("No local model could answer. Send this conversation to a cloud model?")) return send(text, true, userEl);
        addMessage("error", "Not sent: cloud use was declined.");
        return;
      }
      throw err;
    }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = /^event: (.*)$/m.exec(raw)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(raw)?.[1] || "{}");
        if (event === "delta") {
          reply += data.text;
          answeredBy = data.provider;
          setMessage(replyEl, "assistant", reply, answeredBy);
          scrollDown();
        } else if (event === "notice") {
          if (!reply) { showNotice(replyEl, data.text); scrollDown(); }
        } else if (event === "done") {
          state.conversationId = data.conversation_id;
          setMessage(replyEl, "assistant", reply, describe({ ...data, output_tokens: data.usage?.output_tokens }));
          if (data.web_search) showSources(replyEl, data.web_search);
          if (data.deals) showDeals(replyEl, data.deals);
          if (data.price_alerts) clearAlerts(data.price_alerts);
          loadConversations().then(() => {
            const li = $("conversations").querySelector(`[data-id="${data.conversation_id}"] .title`);
            if (li) $("conv-title").textContent = li.textContent;
          });
        } else if (event === "error") {
          throw new Error(data.message);
        }
      }
    }
  } catch (err) {
    if (err.name === "AbortError") {
      setMessage(replyEl, "assistant", reply, "Stopped. This exchange was not saved.");
    } else {
      replyEl.className = "msg error";
      setMessage(replyEl, "error", friendly(err.message), "");
    }
  } finally {
    replyEl.querySelector(".bubble").classList.remove("cursor");
    state.streaming = null;
    setSending(false);
    $("input").focus();
  }
}

// ---------- Live: exchanges from other clients (the voice listener, other tabs) ----------
// The backend announces every exchange on /v1/events. While this page isn't busy with its own reply, it
// shows them as they happen: a voice conversation opens here and its reply streams in.
function isBlankChat() {
  return state.conversationId === null && !!$("thread").querySelector(".empty");
}

function shouldFollow(data) {
  if (state.streaming || state.live) return false;
  if (data.conversation_id !== null && data.conversation_id === state.conversationId) return true;
  if (isBlankChat()) return true;
  return data.source === "voice"; // talking to V.A.R.A. brings its conversation up here
}

async function liveStarted(data) {
  if (!shouldFollow(data)) return;
  const live = { id: data.exchange_id, reply: "", provider: "", el: null, source: data.source };
  state.live = live;
  // Switch to the conversation first; pieces of the reply that arrive meanwhile are kept in live.reply.
  if (data.conversation_id === null) {
    if (!isBlankChat()) newChat();
  } else if (data.conversation_id !== state.conversationId) {
    try { await openConversation(data.conversation_id); } catch { state.live = null; return; }
  }
  if (state.live !== live) return;
  const label = data.source === "voice" ? "🎙 Spoken" : "From another window";
  addMessage("user", data.text, label);
  live.el = addMessage("assistant", live.reply, live.provider);
  live.el.querySelector(".bubble").classList.add("cursor");
}

function liveDelta(data) {
  const live = state.live;
  if (!live || live.id !== data.exchange_id) return;
  live.reply += data.text;
  live.provider = data.provider;
  if (live.el) { setMessage(live.el, "assistant", live.reply, live.provider); scrollDown(); }
}

function liveNotice(data) {
  const live = state.live;
  if (!live || live.id !== data.exchange_id || live.reply || !live.el) return;
  showNotice(live.el, data.text);
  scrollDown();
}

function liveDone(data) {
  const live = state.live;
  if (live && live.id === data.exchange_id) {
    state.live = null;
    // Unless you've opened another conversation in the meantime, this one is now the open one.
    if (live.el?.isConnected) {
      state.conversationId = data.conversation_id;
      markActive();
      live.el.querySelector(".bubble").classList.remove("cursor");
      setMessage(live.el, "assistant", data.text ?? live.reply, describe({ ...data, output_tokens: data.usage?.output_tokens }));
      if (data.web_search) showSources(live.el, data.web_search);
      if (data.deals) showDeals(live.el, data.deals);
    }
  }
  if (data.price_alerts) clearAlerts(data.price_alerts);
  loadConversations().then(() => {
    if (data.conversation_id !== state.conversationId) return;
    const li = $("conversations").querySelector(`[data-id="${data.conversation_id}"] .title`);
    if (li) $("conv-title").textContent = li.textContent;
  });
}

function liveFailed(data) {
  const live = state.live;
  if (!live || live.id !== data.exchange_id) return;
  state.live = null;
  if (live.el) {
    live.el.querySelector(".bubble").classList.remove("cursor");
    setMessage(live.el, "assistant", live.reply, `Not finished: ${data.message}. This exchange was not saved.`);
  }
}

function connectLive() {
  if (!window.EventSource) return;
  const source = new EventSource("/v1/events");
  const on = (name, handler) => source.addEventListener(name, (e) => {
    const data = JSON.parse(e.data);
    if (data.client === CLIENT_ID) return; // this page's own exchange
    handler(data);
  });
  on("exchange_started", liveStarted);
  on("exchange_delta", liveDelta);
  on("exchange_notice", liveNotice);
  on("exchange_done", liveDone);
  on("exchange_failed", liveFailed);
  source.addEventListener("price_alert", (e) => showAlert(JSON.parse(e.data)));
  let dropped = false;
  source.onerror = () => { dropped = true; }; // EventSource reconnects by itself
  source.onopen = () => {
    if (!dropped) return;
    dropped = false;
    // Back after a disconnect (backend restarted): catch up on anything missed.
    state.live = null;
    loadProviders();
    loadConversations();
    if (state.conversationId !== null && !state.streaming) openConversation(state.conversationId).catch(() => {});
  };
}

// ---------- Deals ----------
const money = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function link(url, text) {
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = text;
  return a;
}

// Under a reply that checked prices: every offer found, cheapest first, with where it came from.
function showDeals(el, deals) {
  const box = document.createElement("details");
  box.className = "sources deals";
  box.open = deals.offers.length > 0;
  const summary = document.createElement("summary");
  const watching = deals.watch ? " · now watching" + (deals.watch.target_price ? ` for ${money(deals.watch.target_price)} or less` : "") : "";
  summary.textContent = `Prices for "${deals.query}" · ${deals.offers.length} found${watching}`;
  box.appendChild(summary);
  const table = document.createElement("table");
  for (const o of deals.offers) {
    const row = table.insertRow();
    row.insertCell().append(Object.assign(document.createElement("span"), { textContent: money(o.price) }));
    row.cells[0].className = "price";
    row.insertCell().textContent = o.store;
    row.insertCell().append(link(o.url, o.title));
    const note = [o.source, o.posted ? `posted ${o.posted}` : "", o.votes != null ? `${o.votes > 0 ? "+" : ""}${o.votes} votes` : ""];
    if (o.in_stock === false) note.push("out of stock");
    row.insertCell().textContent = note.filter(Boolean).join(" · ");
  }
  box.appendChild(table);
  if (deals.failed?.length) box.append(`Unavailable this time: ${deals.failed.join(", ")}`);
  el.appendChild(box);
}

// Price alerts from watches: a banner until dismissed (or until V.A.R.A. has told you in a reply).
function showAlert(a) {
  if ($("alerts").querySelector(`[data-alert="${a.id}"]`)) return;
  const div = document.createElement("div");
  div.className = "alert";
  div.dataset.alert = a.id;
  const text = document.createElement("span");
  text.className = "grow";
  text.append(`Price alert: ${a.query} is ${money(a.price)} at ${a.store} · `, link(a.url, "see deal"));
  const close = document.createElement("button");
  close.type = "button";
  close.title = "Dismiss";
  close.textContent = "✕";
  close.onclick = () => {
    div.remove();
    fetch(`/v1/deals/alerts/${a.id}/seen`, { method: "POST" }).catch(() => {});
  };
  div.append("🏷 ", text, close);
  $("alerts").appendChild(div);
}

function clearAlerts(alerts) {
  for (const a of alerts) $("alerts").querySelector(`[data-alert="${a.id}"]`)?.remove();
}

async function loadAlerts() {
  try { for (const a of await api("/v1/deals/alerts?unseen=true")) showAlert(a); } catch {}
}

// Under a reply that used the web: what was searched, and the sources (with the engines that found each).
function showSources(el, search) {
  const box = document.createElement("details");
  box.className = "sources";
  const summary = document.createElement("summary");
  summary.textContent = `Searched the web for "${search.query}" · ${search.results.length} sources`;
  box.appendChild(summary);
  const list = document.createElement("ol");
  for (const r of search.results) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = r.title;
    li.appendChild(a);
    if (r.engines?.length) li.append(` (${r.engines.join(", ")})`);
    list.appendChild(li);
  }
  box.appendChild(list);
  el.appendChild(box);
}

// Local time with its UTC offset, e.g. 2026-11-05T07:04:00-05:00 (toISOString would give UTC).
function localIsoTime() {
  const d = new Date();
  const pad = (n) => String(Math.abs(n)).padStart(2, "0");
  const offset = -d.getTimezoneOffset();
  const sign = offset >= 0 ? "+" : "-";
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
    `${sign}${pad(Math.trunc(offset / 60))}:${pad(offset % 60)}`;
}

function friendly(message) {
  if (/Failed to fetch|NetworkError/i.test(message)) return "Can't reach the V.A.R.A. backend. Is it running? Start it with start-vara.ps1.";
  if (/reach Ollama/i.test(message)) return "Ollama isn't running, so the local model can't answer. Start Ollama (or run start-vara.ps1) and try again.";
  return message;
}

function setSending(on) {
  const btn = $("send");
  btn.textContent = on ? "Stop" : "Send";
  btn.classList.toggle("stop", on);
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.streaming) { state.streaming.abort(); return; }
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autosize();
  send(text);
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 220) + "px";
}
$("input").addEventListener("input", autosize);
$("new-chat").onclick = newChat;
$("menu").onclick = () => document.body.classList.toggle("nav-open");
$("provider").onchange = (e) => { try { localStorage.setItem("vara.provider", e.target.value); } catch {} };

showEmpty();
loadProviders();
loadConversations();
loadAlerts();
connectLive();
</script>
